<!-- ============================================================
     Sponsor Box - 赞助窗口 HTML 片段
     用法：粘贴到设置页面底部（或任意位置）
     依赖：sponsor.css（或已内联样式）
     图片路径：images/alipay.jpg, images/wechat.png
     ============================================================ -->

<div class="sponsor-box">
    <div class="sponsor-title">制作不易，感谢支持</div>
    <div class="sponsor-desc">觉得好用请扫码赞助 ~</div>
    <div class="sponsor-qrcodes">
        <div class="sponsor-qr">
            <img src="images/alipay.jpg" alt="支付宝">
            <div class="qr-label">支付宝</div>
        </div>
        <div class="sponsor-qr">
            <img src="images/wechat.png" alt="微信">
            <div class="qr-label">微信</div>
        </div>
    </div>
</div>
